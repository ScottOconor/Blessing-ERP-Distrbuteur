spring.application.name=erp-backend
server.port=8080

# Database
spring.datasource.url=jdbc:postgresql://localhost:5432/erp_db
spring.datasource.username=automate
spring.datasource.password=automate
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

# Jackson
spring.jackson.serialization.write-dates-as-timestamps=false
spring.jackson.date-format=yyyy-MM-dd
spring.jackson.time-zone=Africa/Douala

# JWT
jwt.secret=erp-jwt-secret-key-2024-very-long-secret-key-must-be-at-least-256-bits
jwt.expiration=86400000

# Logging
logging.level.com.erp=INFO
logging.level.com=DEBUG
logging.level.org.springframework.security=DEBUG
logging.level.org.springframework.web=DEBUG