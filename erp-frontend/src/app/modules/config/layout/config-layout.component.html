<div class="cfg-layout">
  <nav class="cfg-navbar">
    <div class="cfg-brand" (click)="goHome()">
      <span class="material-icons">chevron_left</span>
      <div class="brand-icon"><span class="material-icons">settings</span></div>
      <span class="brand-label">Configuration</span>
    </div>

    <div class="nav-divider"></div>

    <div class="cfg-nav">
      @for (item of navItems; track item.route) {
        <a class="nav-link" [class.active]="isActive(item.route)" (click)="router.navigate([item.route])">
          <span class="material-icons">{{ item.icon }}</span>
          {{ item.label }}
        </a>
      }
    </div>

    <div class="cfg-user">
      @if (isCentralized) {
        <div class="company-selector" [class.open]="showCompanyPicker">
          <button class="company-btn" (click)="showCompanyPicker = !showCompanyPicker; $event.stopPropagation()">
            <span class="material-icons">business</span>
            <span>{{ activeCompany?.sigle || activeCompany?.name || 'Entreprise' }}</span>
            <span class="material-icons arrow">expand_more</span>
          </button>
          @if (showCompanyPicker) {
            <div class="company-dropdown">
              @for (c of companies; track c.id) {
                <button class="company-option" [class.selected]="c.id === activeCompany?.id" (click)="switchCompany(c.id)">
                  <span class="material-icons">{{ c.id === activeCompany?.id ? 'check_circle' : 'radio_button_unchecked' }}</span>
                  <span class="company-opt-name">{{ c.name }}</span>
                  @if (c.sigle) { <span class="company-sigle">{{ c.sigle }}</span> }
                </button>
              }
            </div>
          }
        </div>
      }
      <div class="user-badge">
        <span class="user-initials">{{ authService.getUserInitials() }}</span>
      </div>
      <span class="user-name">{{ authService.getUserDisplayName() }}</span>
      <button class="btn-logout" (click)="logout()" title="Déconnexion">
        <span class="material-icons">logout</span>
      </button>
    </div>
  </nav>

  <main class="cfg-content">
    <router-outlet />
  </main>
</div>
